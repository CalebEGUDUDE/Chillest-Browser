<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Files</title>
    <link rel="stylesheet" href="../shared.css">
    <link rel="stylesheet" href="style.css">
    <script src="../theme.js" defer></script>
    <script src="app.js" defer></script>
</head>
<body>
    <main>
        <p class="muted file-path">Home / Recent</p>
        <div class="file-list">
            <button class="file-entry" type="button"><span aria-hidden="true">▧</span><span>Sunday playlist</span><small>Audio</small></button>
            <button class="file-entry" type="button"><span aria-hidden="true">▤</span><span>Little ideas.txt</span><small>Text</small></button>
            <button class="file-entry" type="button"><span aria-hidden="true">▣</span><span>Wallpaper collection</span><small>Images</small></button>
            <button class="file-entry" type="button"><span aria-hidden="true">◷</span><span>Recently opened</span><small>Folder</small></button>
        </div>
        <p class="muted file-status" id="file-status" aria-live="polite"></p>
    </main>
</body>
</html>
