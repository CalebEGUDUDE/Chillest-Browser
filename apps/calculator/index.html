<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Calculator</title>
    <link rel="stylesheet" href="../shared.css">
    <link rel="stylesheet" href="style.css">
    <script src="../theme.js" defer></script>
    <script src="app.js" defer></script>
</head>
<body>
    <main class="calculator">
        <output class="calculator-display" id="display" aria-live="polite">0</output>
        <button class="calc-key operator" data-key="clear">AC</button><button class="calc-key operator" data-key="sign">±</button><button class="calc-key operator" data-key="percent">%</button><button class="calc-key operator" data-key="/">÷</button>
        <button class="calc-key" data-key="7">7</button><button class="calc-key" data-key="8">8</button><button class="calc-key" data-key="9">9</button><button class="calc-key operator" data-key="*">×</button>
        <button class="calc-key" data-key="4">4</button><button class="calc-key" data-key="5">5</button><button class="calc-key" data-key="6">6</button><button class="calc-key operator" data-key="-">−</button>
        <button class="calc-key" data-key="1">1</button><button class="calc-key" data-key="2">2</button><button class="calc-key" data-key="3">3</button><button class="calc-key operator" data-key="+">+</button>
        <button class="calc-key calc-zero" data-key="0">0</button><button class="calc-key" data-key=".">.</button><button class="calc-key equals" data-key="equals">=</button>
    </main>
</body>
</html>
